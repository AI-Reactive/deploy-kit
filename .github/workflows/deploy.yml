# Общая выкладка (reusable workflow). Вызывается из репозитория проекта.
name: deploy-kit deploy
on:
  workflow_call:
    inputs:
      runner:   { type: string, required: true,  description: "лейбл раннера проекта, напр. ai-reactive" }
      config:   { type: string, default: deploy.conf }
      dry_run:  { type: boolean, default: false }
jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 15
    steps:
      # Вместо actions/checkout: постоянная копия в домашней папке пользователя раннера,
      # подтягивается только нужный коммит (fetch + reset --hard + clean -ffdx).
      - name: Код (постоянная копия)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: /opt/deploy-kit/bin/dk-sync "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$HOME/src/${GITHUB_REPOSITORY#*/}"
      - name: Выкладка
        env: { DRY_RUN: "${{ inputs.dry_run && '1' || '0' }}" }
        run: /opt/deploy-kit/bin/dk-deploy "$HOME/src/${GITHUB_REPOSITORY#*/}" "$HOME/src/${GITHUB_REPOSITORY#*/}/${{ inputs.config }}"
