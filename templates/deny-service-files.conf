# deploy-kit: закрыть служебные файлы и папки от прямого доступа (404).
# Подключать в server{} ДО остальных regex-location (в т.ч. до location ~ \.php$):
#     include snippets/deny-service-files.conf;
# ACME/well-known остаются доступны.
location ^~ /.well-known/ { try_files $uri =404; }

# Скрытые файлы и папки (.env, .git, .github, .gitignore ...)
location ~ /\. { return 404; }

# Служебные файлы в корне релиза
location ~ ^/(REVISION|AGENTS\.md|LINK_MAP\.md|README\.md|deploy\.conf|composer\.(json|lock)|package(-lock)?\.json)$ { return 404; }

# По расширениям (базы, логи, дампы, конфиги, доки, бэкапы, скрипты)
location ~* (\.(sqlite|sqlite3|db|log|sql|dump|sh|env|conf|ini|lock|md|bak|old|orig|swp|py|yml|yaml|mmdb|jsonl|err|done|dist)$|\.bak-[^/]*$|~$) { return 404; }

# Служебные папки на любом уровне (включая .php внутри них)
location ~ /(docs|storage|config|ref|data|database|migrations|tests|briefs|scripts|base|logs|backups?|vendor/composer|node_modules)/ { return 404; }
