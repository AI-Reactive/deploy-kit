# Конфиг выкладки проекта (deploy-kit). Bash-синтаксис.
DOMAIN=example.ru
APP_DIR=/var/www/example.ru          # внутри: releases/ current/ shared/
SHARED_DIRS="uploads"                # каталоги, общие для всех релизов (запись www-data)
SHARED_FILES=".env"                  # файлы с секретами/данными, лежат в shared/
KEEP_RELEASES=5
HEALTH_PATH=/                        # должна отдавать 200, иначе автооткат
PHP_LINT=all                         # all | off
# HOOK_BUILD="npm ci && npm run build"   # перед переключением, в папке релиза
# HOOK_AFTER_SWITCH="..."                # после переключения (миграции, рестарт сервиса)
